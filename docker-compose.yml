# Local development:   docker compose up -d qdrant        (run API/UI/Ollama natively)
# Full stack:          docker compose --profile app up -d --build
# Ollama in Docker:    add --profile ollama and set OLLAMA_HOST_DOCKER=http://ollama:11434
#   (on macOS prefer native Ollama: Docker cannot use the Apple GPU)

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU (Linux only):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    container_name: complaint_insights_api
    profiles: ["app"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/bigquery-key.json
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      - qdrant
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: complaint_insights_ui
    profiles: ["app"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  qdrant_storage:
  ollama_models:
