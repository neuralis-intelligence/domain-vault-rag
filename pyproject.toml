[project]
name = "complaint-insights-agent"
version = "1.0.0"
description = "Hybrid text-to-SQL + RAG agent over CFPB bank complaints"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs live services (Ollama, Qdrant, BigQuery); run with -m integration",
]
filterwarnings = [
    # Unit tests construct QdrantClient without a server running.
    "ignore:Failed to obtain server version:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Prompt text reads better unwrapped.
"app/prompts/*" = ["E501"]
